name: GitHub Pages publikálás

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Forrás letöltése
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: GitHub Pages útvonalak beállítása
        shell: bash
        env:
          CONFIGURED_SITE_URL: ${{ vars.SITE_URL }}
          CONFIGURED_PATH_PREFIX: ${{ vars.ELEVENTY_PATH_PREFIX }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$CONFIGURED_SITE_URL" ]; then
            echo "SITE_URL=$CONFIGURED_SITE_URL" >> "$GITHUB_ENV"
          else
            echo "SITE_URL=https://$REPOSITORY_OWNER.github.io" >> "$GITHUB_ENV"
          fi

          if [ -n "$CONFIGURED_PATH_PREFIX" ]; then
            echo "ELEVENTY_PATH_PREFIX=$CONFIGURED_PATH_PREFIX" >> "$GITHUB_ENV"
          elif [ "$REPOSITORY_NAME" = "$REPOSITORY_OWNER.github.io" ]; then
            echo "ELEVENTY_PATH_PREFIX=/" >> "$GITHUB_ENV"
          else
            echo "ELEVENTY_PATH_PREFIX=/$REPOSITORY_NAME/" >> "$GITHUB_ENV"
          fi

      - name: Függőségek telepítése
        run: npm ci

      - name: Statikus oldal építése és ellenőrzése
        run: npm run build

      - name: Pages-artifact feltöltése
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: GitHub Pages publikálása
        id: deployment
        uses: actions/deploy-pages@v4
